<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTTINGER Sochi — Профессиональные отделочные материалы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            line-height: 1.4;
        }
        
        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid #222222;
        }
        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .logo span {
            color: #ff5722;
        }
        .phone {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Первый экран - центрированный макет */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
            max-width: 900px; /* Сузили ширину, чтобы длинный заголовок красиво ломался на строки */
            margin: 0 auto;
            min-height: calc(100vh - 70px);
            justify-content: center;
        }
        .hero-content {
            margin-bottom: 40px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 30px;
            font-weight: 800;
            color: #ffffff;
        }
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        .btn {
            display: inline-block;
            text-align: center;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            width: 100%;
            max-width: 320px; /* Ограничили ширину кнопок на больших экранах */
        }
        .btn-primary {
            background-color: #ff5722;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #444444;
        }
        
        /* Демонстрационный GIF по центру внизу */
        .hero-media {
            width: 100%;
            max-width: 640px; /* Оптимальный размер для центрированного плеера */
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a1a;
            aspect-ratio: 16 / 9;
            border: 1px solid #222222;
        }
        .hero-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность для ПК */
        @media (min-width: 768px) {
            header {
                padding: 20px 40px;
            }
            .hero {
                padding: 60px 40px;
            }
            h1 {
                font-size: 3.2rem;
            }
            .cta-container {
                flex-direction: row;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">OTTINGER<span>.</span> SOCHI</div>
        <a href="tel:+79782214051" class="phone">+7 (978) 221-40-51</a>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Как навсегда избавить малярные работы от брака и бесконечных переделок</h1>
            <div class="cta-container">
                <a href="https://wa.me/79782214051?text=Здравствуйте!%20Хочу%20провести%20тест-драйв%20материалов%20OTTINGER%20на%20объекте." class="btn btn-primary" target="_blank">Проверить прочность</a>
                <a href="#how-it-works" class="btn btn-secondary">Как это работает ↓</a>
            </div>
        </div>

        <div class="hero-media">
            <img src="ottinger-demo.gif" alt="Демонстрация нанесения OTTINGER" loading="eager">
        </div>
    </main>

</body>
</html>
